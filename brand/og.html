<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Host Grotesk"; src: url("../apps/web/public/fonts/host-grotesk.woff2") format("woff2"); font-weight: 300 800; }
@font-face { font-family: "Fragment Mono"; src: url("../apps/web/public/fonts/fragment-mono.woff2") format("woff2"); }
:root { --bg: #F4F4F6; --panel: #FFFFFF; --ink: #0E0E12; --ink-2: #4D4D57; --ink-3: #6E6E78; --hair: rgb(14 14 18 / .1); --hair-2: rgb(14 14 18 / .2); --panel-2: #F4F4F6; --trunk: #CACAD2; --rel: #9A9AA6; --you: #3B2BFF; --you-soft: #EDEBFF; }
html, body { margin: 0; }
body { width: 100vw; height: 100vh; background: var(--bg); color: var(--ink); font-family: "Host Grotesk", sans-serif; position: relative; overflow: hidden; -webkit-font-smoothing: antialiased; }

.wm { position: absolute; left: 64px; top: 60px; height: 40px; }
h1 { position: absolute; left: 64px; top: 136px; width: 620px; margin: 0; font-size: 68px; line-height: 1.02; letter-spacing: -0.032em; font-weight: 800; }
h1 span { display: block; text-wrap: balance; } h1 .you { color: var(--you); } h1 b { font-weight: inherit; white-space: nowrap; }
.sub { position: absolute; left: 64px; top: 434px; width: 560px; margin: 0; font-size: 27px; line-height: 1.3; letter-spacing: -0.012em; color: var(--ink-2); text-wrap: balance; }

.ask { --r: 20px; --in: 10px; position: absolute; left: 64px; top: 366px; width: 600px; height: 76px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: var(--in); padding-left: 14px; background: var(--panel); border: 1.5px solid var(--hair-2); border-radius: var(--r); box-shadow: 0 1px 2px rgb(14 14 18 / .04), 0 10px 28px -14px rgb(14 14 18 / .16); }
.ask p { margin: 0; font-size: 25px; letter-spacing: -0.012em; white-space: nowrap; display: flex; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 5px; margin-right: 10px; background: var(--panel-2); border: 1.5px solid var(--hair-2); border-radius: 11px; font-weight: 600; font-size: 20px; }
.badge img { width: 28px; height: 28px; border-radius: 7px; display: block; }
.caret { width: 3px; height: 30px; margin-left: 2px; background: var(--you); border-radius: 1px; }
.go { align-self: stretch; padding: 0 22px; border-radius: calc(var(--r) - var(--in)); background: var(--you); color: #fff; font-size: 20px; font-weight: 700; display: grid; place-items: center; }

.card { position: absolute; left: 724px; right: -124px; top: 124px; height: 560px; background: var(--panel); border: 1.5px solid var(--hair); border-radius: 22px; overflow: hidden; }
.head { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 26px; border-bottom: 1.5px solid var(--hair); font-size: 20px; color: var(--ink-2); text-wrap: balance; }
.head .name { display: flex; align-items: center; gap: 10px; }
.head .name b { color: var(--ink); font-weight: 700; }
.head .name svg { width: 20px; height: 20px; fill: var(--ink-3); }
.head small { font: 400 16px "Fragment Mono", monospace; color: var(--ink-3); margin-right: 162px; }

svg.g { position: absolute; left: 0; top: 64px; }
.trunk { stroke: var(--trunk); stroke-width: 4.5; fill: none; }
.yours { stroke: var(--you); stroke-width: 4.5; fill: none; }
.intent { stroke: var(--you); stroke-width: 2.5; stroke-dasharray: 2 7; stroke-linecap: round; fill: none; opacity: .55; }
.commit { fill: var(--trunk); }
.rel { fill: var(--panel); stroke: var(--rel); stroke-width: 4; }
.node { fill: var(--you); }

.row { position: absolute; left: 112px; transform: translateY(-50%); white-space: nowrap; display: flex; flex-direction: column; gap: 4px; }
.row b { font-size: 29px; font-weight: 700; letter-spacing: -0.015em; color: var(--you); }
.row small { font: 400 19px "Fragment Mono", monospace; color: var(--ink-3); }
.row.rel { flex-direction: row; gap: 10px; font-size: 19px; }
.row.rel img { width: 24px; height: 24px; border-radius: 6px; }
.band { position: absolute; left: 0; right: 0; background: var(--you-soft); }
.row .agent { color: var(--you); }
.row.rel { font: 400 19px "Fragment Mono", monospace; color: var(--ink-3); align-items: center; }
.tag { padding: 3px 8px; border: 1.5px solid #C4C4CC; border-radius: 6px; color: var(--ink); }

.url { position: absolute; right: 64px; top: 68px; font: 400 21px "Host Grotesk", sans-serif; color: var(--ink-3); }
</style>
</head>
<body>
<img class="wm" src="logo/autofork.svg" alt="">
<span class="url">autofork.com</span>
<h1><span>Customized forks</span><span class="you">that maintain themselves.</span></h1>
<p class="sub">Every release, your changes are reapplied intelligently. When they ship the same feature, autofork stops applying yours.</p>


<div class="card">
  <div class="head">
    <span class="name"><svg viewBox="0 0 16 16"><path d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v.878A2.25 2.25 0 0 0 5.75 8.5h1.5v2.128a2.251 2.251 0 1 0 1.5 0V8.5h1.5a2.25 2.25 0 0 0 2.25-2.25v-.878a2.25 2.25 0 1 0-1.5 0v.878a.75.75 0 0 1-.75.75h-4.5A.75.75 0 0 1 5 6.25v-.878Zm3.75 7.378a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm3-8.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>you / <b>t3code</b></span>
    <small>follows releases</small>
  </div>
  <div class="band" style="top:64px;height:132px"></div>
  <svg class="g" width="600" height="500" viewBox="0 0 600 500"><g id="graph"></g></svg>
  <div id="rows"></div>
</div>

<script>
  const A = 44, B = 82, head = 64, lift = 62
  const rows = [
    { y: 64, title: "4 changes on top", note: "ready for their next release" },
    { y: 200, title: "every change kept", note: "no agent needed", tag: "+156 commits", when: "Oct 12" },
    { y: 338, title: "rebuilt by the agent", note: "a change broke on day one", tag: "+383 commits", when: "Oct 10" },
  ]
  const peel = (x1, y1, x2, y2) => `M${x1} ${y1}C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}`
  let g = `<path class="intent" d="M${B} 0V500"/><path class="trunk" d="M${A} 0V500"/>`
  for (const y of [22, 118, 164, 310, 450, 494]) g += `<circle class="commit" cx="${A}" cy="${y}" r="5"/>`
  for (const r of rows) if (r.tag) g += `<path class="yours" d="${peel(A, r.y + lift, B, r.y + 14)}V${r.y}"/><circle class="rel" cx="${A}" cy="${r.y + lift}" r="9"/>`
  for (const r of rows) g += `<circle class="node" cx="${B}" cy="${r.y}" r="10"/>`
  document.querySelector("#graph").innerHTML = g
  document.querySelector("#rows").innerHTML = rows.map((r) => `
    <div class="row" style="top:${head + r.y}px"><b>${r.title}</b><small>${r.note}</small></div>
    ${r.tag ? `<div class="row rel" style="top:${head + r.y + lift + 2}px"><img src="logo/vendor/t3code.png" alt=""><span class="tag">${r.tag}</span>${r.when}</div>` : ""}`).join("")
</script>
</body>
</html>
